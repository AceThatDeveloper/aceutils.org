<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AUClothing — Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #05070b;
            color: white;
            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(45, 110, 255, 0.12);
            filter: blur(130px);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Subtle grid */
        .grid {
            position: absolute;
            inset: 0;
            opacity: 0.12;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: radial-gradient(circle at center, black, transparent 75%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 800px;
            animation: fadeIn 0.8s ease forwards;
        }

        .error {
            font-size: clamp(90px, 17vw, 190px);
            line-height: 0.85;
            font-weight: 900;
            letter-spacing: -12px;
            color: #ffffff;
            opacity: 0.96;
            text-shadow: 0 0 50px rgba(255,255,255,0.05);
        }

        .brand {
            margin-top: 35px;
            font-size: clamp(30px, 5vw, 55px);
            font-weight: 800;
            letter-spacing: -2px;
        }

        .brand span {
            color: #4b8cff;
        }

        .line {
            width: 55px;
            height: 3px;
            background: #4b8cff;
            margin: 24px auto;
            border-radius: 10px;
            box-shadow: 0 0 18px rgba(75, 140, 255, 0.5);
        }

        .title {
            font-size: clamp(24px, 4vw, 40px);
            font-weight: 700;
            margin-bottom: 14px;
        }

        .description {
            color: #8e96a8;
            font-size: 16px;
            line-height: 1.7;
            max-width: 570px;
            margin: 0 auto;
        }

        .buttons {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .discord {
            background: #5865F2;
            color: white;
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.18);
        }

        .discord:hover {
            transform: translateY(-2px);
            background: #6875ff;
            box-shadow: 0 12px 30px rgba(88, 101, 242, 0.28);
        }

        .home {
            border: 1px solid #242936;
            background: rgba(255,255,255,0.025);
            color: #cbd0da;
        }

        .home:hover {
            transform: translateY(-2px);
            border-color: #394153;
            background: rgba(255,255,255,0.05);
        }

        .status {
            margin-top: 34px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid #1d2430;
            background: rgba(255,255,255,0.025);
            color: #777f90;
            font-size: 12px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #4b8cff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(75,140,255,0.8);
        }

        .footer {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #454c5a;
            font-size: 12px;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .error {
                letter-spacing: -7px;
            }

            .brand {
                margin-top: 25px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="glow"></div>
        <div class="grid"></div>

        <section class="content">

            <div class="error">404</div>

            <div class="brand">
                AU<span>Clothing</span>
            </div>

            <div class="line"></div>

            <h1 class="title">Coming Soon!</h1>

            <p class="description">
                Something new is being built.
                AUClothing is currently under construction.
                Stay tuned — we're getting everything ready.
            </p>

            <div class="buttons">

                <a
                    class="button discord"
                    href="https://discord.gg/U9nhevs7xM"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Join the Discord
                </a>

                <a
                    class="button home"
                    href="/"
                >
                    Back to AU
                </a>

            </div>

            <div class="status">
                <span class="dot"></span>
                AUClothing is under construction
            </div>

        </section>

        <div class="footer">
            © 2026 AUClothing
        </div>

    </main>

</body>
</html>
