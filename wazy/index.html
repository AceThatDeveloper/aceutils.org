<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wazy AI — AceUtils</title>
    <meta name="description" content="Wazy AI by AceUtils">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0b0b;
            --sidebar: #101010;
            --panel: #151515;
            --panel-hover: #1c1c1c;
            --border: #292929;
            --text: #f5f5f5;
            --muted: #999999;
            --green: #ffffff;
            --user: #2a2a2a;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button,
        textarea {
            font-family: inherit;
        }

        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 8px 18px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
        }

        .brand-text {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .brand-text span {
            color: #777;
            font-weight: 500;
        }

        .new-chat {
            width: 100%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            border-radius: 9px;
            padding: 11px 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            transition: 0.15s ease;
        }

        .new-chat:hover {
            background: var(--panel-hover);
        }

        .new-chat-icon {
            font-size: 18px;
            line-height: 1;
        }

        .sidebar-label {
            margin: 25px 8px 9px;
            color: #666;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .chat-history {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            color: #aaa;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: default;
        }

        .history-item.active {
            background: #191919;
            color: #eee;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .sidebar-link {
            width: 100%;
            border: 0;
            background: transparent;
            color: #999;
            padding: 10px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.15s ease;
        }

        .sidebar-link:hover {
            background: var(--panel-hover);
            color: #fff;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            height: 100vh;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            flex-shrink: 0;
        }

        .model-name {
            font-size: 14px;
            font-weight: 600;
        }

        .model-name span {
            color: #777;
            font-weight: 400;
            margin-left: 5px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-button {
            border: 1px solid var(--border);
            background: transparent;
            color: #aaa;
            padding: 7px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.15s ease;
        }

        .top-button:hover {
            background: var(--panel-hover);
            color: #fff;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-bottom: 160px;
        }

        .chat::-webkit-scrollbar {
            width: 8px;
        }

        .chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat::-webkit-scrollbar-thumb {
            background: #292929;
            border-radius: 10px;
        }

        .welcome {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 170px;
        }

        .welcome-inner {
            width: min(760px, 100%);
            text-align: center;
        }

        .wazy-logo {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            font-weight: 800;
            font-size: 24px;
            box-shadow: 0 0 35px rgba(255,255,255,0.07);
        }

        .welcome h1 {
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }

        .suggestions {
            margin-top: 32px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .suggestion {
            border: 1px solid var(--border);
            background: #111;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            color: #ddd;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .suggestion:hover {
            background: #181818;
            border-color: #3a3a3a;
        }

        .suggestion-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .suggestion-text {
            color: #777;
            font-size: 12px;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            width: min(850px, calc(100% - 40px));
            margin: 0 auto;
            padding: 25px 0;
            display: flex;
            gap: 15px;
        }

        .message + .message {
            border-top: 1px solid rgba(255,255,255,0.025);
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .avatar.user {
            background: #333;
            color: #fff;
        }

        .avatar.wazy {
            background: #fff;
            color: #000;
        }

        .message-content {
            min-width: 0;
            flex: 1;
        }

        .message-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #aaa;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.75;
            color: #e5e5e5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user-message .message-text {
            background: var(--user);
            border-radius: 12px;
            padding: 11px 14px;
            display: inline-block;
            max-width: 100%;
        }

        .message-actions {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }

        .message-action {
            border: 0;
            background: transparent;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 5px;
        }

        .message-action:hover {
            background: #191919;
            color: #aaa;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 20px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #aaa;
            border-radius: 50%;
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px 20px 18px;
            background: linear-gradient(
                to top,
                #0b0b0b 65%,
                rgba(11,11,11,0)
            );
        }

        .composer {
            width: min(850px, 100%);
            margin: 0 auto;
        }

        .input-box {
            background: #171717;
            border: 1px solid #303030;
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 9px;
            box-shadow: 0 8px 35px rgba(0,0,0,0.25);
            transition: 0.15s ease;
        }

        .input-box:focus-within {
            border-color: #444;
        }

        textarea {
            width: 100%;
            max-height: 180px;
            min-height: 42px;
            resize: none;
            background: transparent;
            border: 0;
            outline: 0;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px 8px;
        }

        textarea::placeholder {
            color: #666;
        }

        .send {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 0;
            background: #fff;
            color: #000;
            cursor: pointer;
            font-size: 17px;
            flex-shrink: 0;
            transition: 0.15s ease;
        }

        .send:hover {
            transform: translateY(-1px);
            background: #ddd;
        }

        .send:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .disclaimer {
            text-align: center;
            color: #555;
            font-size: 10px;
            margin-top: 8px;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-menu {
            display: none;
        }

        @media (max-width: 760px) {
            .sidebar {
                display: none;
            }

            .mobile-menu {
                display: block;
                border: 0;
                background: transparent;
                color: #aaa;
                font-size: 20px;
                cursor: pointer;
            }

            .topbar {
                padding: 0 15px;
            }

            .message {
                width: calc(100% - 28px);
                gap: 10px;
            }

            .composer-area {
                padding-left: 10px;
                padding-right: 10px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome {
                padding-bottom: 170px;
            }

            .top-actions .top-button {
                display: none;
            }
        }

        /* =========================
           SIDEBAR MOBILE DRAWER
        ========================= */

        .mobile-sidebar {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            display: none;
        }

        .mobile-sidebar.open {
            display: block;
        }

        .mobile-sidebar-inner {
            width: 270px;
            height: 100%;
            background: #101010;
            border-right: 1px solid #292929;
            padding: 14px;
        }

        .close-mobile {
            border: 0;
            background: transparent;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">W</div>
            <div class="brand-text">
                Wazy <span>AI</span>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            <span class="new-chat-icon">+</span>
            <span>New chat</span>
        </button>

        <div class="sidebar-label">
            Recent
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="history-item active">
                New conversation
            </div>
        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-link" onclick="window.location.href='/'">
                ← Back to AceUtils
            </button>

            <button class="sidebar-link" onclick="showAbout()">
                About Wazy
            </button>

        </div>

    </aside>

    <!-- MOBILE SIDEBAR -->
    <div class="mobile-sidebar" id="mobileSidebar">

        <div class="mobile-sidebar-inner">

            <button class="close-mobile" onclick="closeMobileMenu()">
                ×
            </button>

            <div class="brand">
                <div class="brand-icon">W</div>
                <div class="brand-text">
                    Wazy <span>AI</span>
                </div>
            </div>

            <button class="new-chat" onclick="newChat(); closeMobileMenu();">
                <span class="new-chat-icon">+</span>
                <span>New chat</span>
            </button>

        </div>

    </div>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;gap:12px;">

                <button class="mobile-menu" onclick="openMobileMenu()">
                    ☰
                </button>

                <div class="model-name">
                    Wazy AI
                    <span>Hardcoded</span>
                </div>

            </div>

            <div class="top-actions">

                <button class="top-button" onclick="newChat()">
                    New chat
                </button>

                <button class="top-button" onclick="showAbout()">
                    About
                </button>

            </div>

        </header>

        <!-- CHAT AREA -->
        <section class="chat" id="chat">

            <!-- WELCOME -->
            <div class="welcome" id="welcome">

                <div class="welcome-inner">

                    <div class="wazy-logo">
                        W
                    </div>

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        I'm Wazy, the AceUtils assistant.
                        Ask me about AceUtils, coding, Gorilla Tag,
                        mods, or software development.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion"
                            onclick="useSuggestion('What is AceUtils?')">

                            <div class="suggestion-title">
                                What is AceUtils?
                            </div>

                            <div class="suggestion-text">
                                Learn about the AceUtils project.
                            </div>

                        </button>

                        <button class="suggestion"
                            onclick="useSuggestion('What is AceUtilsPad?')">

                            <div class="suggestion-title">
                                What is AceUtilsPad?
                            </div>

                            <div class="suggestion-text">
                                Learn about the Gorilla Tag utility tablet.
                            </div>

                        </button>

                        <button class="suggestion"
                            onclick="useSuggestion('What programming languages does Ace use?')">

                            <div class="suggestion-title">
                                What does Ace code in?
                            </div>

                            <div class="suggestion-text">
                                Learn about Ace's development work.
                            </div>

                        </button>

                        <button class="suggestion"
                            onclick="useSuggestion('Tell me about Gorilla Tag mods')">

                            <div class="suggestion-title">
                                Gorilla Tag mods
                            </div>

                            <div class="suggestion-text">
                                Ask about Gorilla Tag mod development.
                            </div>

                        </button>

                    </div>

                </div>

            </div>

        </section>

        <!-- COMPOSER -->
        <div class="composer-area">

            <div class="composer">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Message Wazy..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button
                        class="send"
                        id="sendButton"
                        onclick="sendMessage()"
                        disabled
                    >
                        ↑
                    </button>

                </div>

                <div class="disclaimer">
                    Wazy AI uses hard-coded responses. It does not use an AI API.
                </div>

            </div>

        </div>

    </main>

</div>

<script>

    /* =========================================================
       WAZY AI
       Hard-coded response system
    ========================================================= */

    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const history = document.getElementById("chatHistory");

    let messageCount = 0;

    /* =========================================================
       INPUT
    ========================================================= */

    input.addEventListener("input", () => {

        sendButton.disabled = input.value.trim().length === 0;

        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 180) + "px";

    });

    input.addEventListener("keydown", (event) => {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            if (!sendButton.disabled) {
                sendMessage();
            }

        }

    });

    /* =========================================================
       SUGGESTIONS
    ========================================================= */

    function useSuggestion(text) {

        input.value = text;

        input.dispatchEvent(new Event("input"));

        sendMessage();

    }

    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    function sendMessage() {

        const text = input.value.trim();

        if (!text) {
            return;
        }

        if (messageCount === 0) {
            welcome.style.display = "none";
        }

        addMessage("user", text);

        messageCount++;

        updateHistory(text);

        input.value = "";
        input.style.height = "auto";
        sendButton.disabled = true;

        showTyping();

        const delay = 650 + Math.floor(Math.random() * 500);

        setTimeout(() => {

            removeTyping();

            const response = getResponse(text);

            addMessage("wazy", response);

        }, delay);

    }

    /* =========================================================
       ADD MESSAGE
    ========================================================= */

    function addMessage(type, text) {

        const message = document.createElement("div");

        message.className =
            "message " +
            (type === "user" ? "user-message" : "wazy-message");

        const avatar = document.createElement("div");

        avatar.className =
            "avatar " +
            (type === "user" ? "user" : "wazy");

        avatar.textContent =
            type === "user" ? "U" : "W";

        const content = document.createElement("div");

        content.className = "message-content";

        const name = document.createElement("div");

        name.className = "message-name";

        name.textContent =
            type === "user" ? "You" : "Wazy";

        const messageText = document.createElement("div");

        messageText.className = "message-text";

        messageText.textContent = text;

        content.appendChild(name);
        content.appendChild(messageText);

        if (type === "wazy") {

            const actions = document.createElement("div");

            actions.className = "message-actions";

            const copyButton = document.createElement("button");

            copyButton.className = "message-action";
            copyButton.textContent = "Copy";

            copyButton.onclick = () => {

                navigator.clipboard.writeText(text);

                copyButton.textContent = "Copied";

                setTimeout(() => {
                    copyButton.textContent = "Copy";
                }, 1200);

            };

            actions.appendChild(copyButton);

            content.appendChild(actions);

        }

        message.appendChild(avatar);
        message.appendChild(content);

        chat.appendChild(message);

        scrollToBottom();

    }

    /* =========================================================
       TYPING INDICATOR
    ========================================================= */

    function showTyping() {

        const message = document.createElement("div");

        message.className = "message";
        message.id = "typingMessage";

        message.innerHTML = `
            <div class="avatar wazy">W</div>

            <div class="message-content">

                <div class="message-name">
                    Wazy
                </div>

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        `;

        chat.appendChild(message);

        scrollToBottom();

    }

    function removeTyping() {

        const typing = document.getElementById("typingMessage");

        if (typing) {
            typing.remove();
        }

    }

    /* =========================================================
       HARD-CODED AI RESPONSE ENGINE
    ========================================================= */

    function getResponse(message) {

        const text = message
            .toLowerCase()
            .trim();

        /* GREETINGS */

        if (
            containsAny(text, [
                "hello",
                "hi",
                "hey",
                "yo",
                "sup",
                "what's up",
                "whats up"
            ])
        ) {

            return randomResponse([
                "Hey! I'm Wazy. What do you want to know?",
                "Yo! What's up?",
                "Hey! How can I help?",
                "What's up! Ask me anything about AceUtils or coding."
            ]);

        }

        /* WHO ARE YOU */

        if (
            containsAny(text, [
                "who are you",
                "what are you",
                "what is wazy",
                "wazy ai",
                "about wazy"
            ])
        ) {

            return "I'm Wazy AI, the AceUtils assistant. I'm a hard-coded chatbot built into aceutils.org/wazy. I don't use an external AI API — my responses are programmed directly into the website.";

        }

        /* ACEUTILS */

        if (
            containsAny(text, [
                "what is aceutils",
                "what's aceutils",
                "tell me about aceutils",
                "aceutils"
            ])
        ) {

            return "AceUtils is a software and development project focused on tools, websites, Gorilla Tag mods, utilities, and other software projects. The main website is aceutils.org.";

        }

        /* ACEUTILSPAD */

        if (
            containsAny(text, [
                "aceutilspad",
                "ace utils pad",
                "utility pad",
                "utils pad"
            ])
        ) {

            return "AceUtilsPad is a Gorilla Tag utility tablet/mod project. It is designed to put useful tools and information into one customizable in-game interface.";

        }

        /* MOD CHECKER */

        if (
            containsAny(text, [
                "mod checker",
                "checker",
                "detect mods",
                "detecting mods",
                "mod detection"
            ])
        ) {

            return "The AceUtils mod checker is designed around detecting known Gorilla Tag mods and reporting what it finds. The detection data can be maintained through the AceUtils data system.";

        }

        /* GORILLA TAG */

        if (
            containsAny(text, [
                "gorilla tag",
                "gtag",
                "monke",
                "gorilla"
            ])
        ) {

            return "Gorilla Tag is one of the main areas Ace works on. That includes legal mods, utilities, mod checkers, UI projects, and other development experiments.";

        }

        /* LEGAL MODS */

        if (
            containsAny(text, [
                "legal mods",
                "legal mod",
                "is modding legal",
                "are mods legal"
            ])
        ) {

            return "Modding depends on the game, platform, mod, and how it is used. Ace's projects are intended as legal Gorilla Tag mods and development projects, not cheats or malicious software.";

        }

        /* CODING */

        if (
            containsAny(text, [
                "coding",
                "programming",
                "developer",
                "software development",
                "software developer"
            ])
        ) {

            return "Ace works on software development and coding projects, especially C#, Python, HTML, CSS, JavaScript, Unity, .NET, Discord bots, and web development.";

        }

        /* C# */

        if (
            containsAny(text, [
                "c#",
                "c sharp",
                "dotnet",
                ".net"
            ])
        ) {

            return "C# is one of the main languages used in Ace's projects. It is especially useful for Unity/Gorilla Tag mods, desktop software, and .NET applications.";

        }

        /* PYTHON */

        if (
            containsAny(text, [
                "python",
                "python code",
                "python programming"
            ])
        ) {

            return "Python is used for projects like Discord bots, automation, utilities, and other development experiments.";

        }

        /* HTML */

        if (
            containsAny(text, [
                "html",
                "website",
                "web development",
                "css",
                "javascript",
                "js"
            ])
        ) {

            return "AceUtils uses web technologies including HTML, CSS, and JavaScript. The AceUtils website also has dedicated pages like /data, /ai, and /wazy.";

        }

        /* UNITY */

        if (
            containsAny(text, [
                "unity",
                "unity engine",
                "unity modding"
            ])
        ) {

            return "Unity is commonly used for Gorilla Tag development and mods. C# scripts can interact with Unity components and game systems.";

        }

        /* DISCORD */

        if (
            containsAny(text, [
                "discord",
                "discord server",
                "aceutils server"
            ])
        ) {

            return "AceUtils has a Discord community where updates, projects, development information, and other AceUtils-related stuff can be shared.";

        }

        /* WEBSITE */

        if (
            containsAny(text, [
                "website",
                "site",
                "aceutils.org",
                "aceutils org"
            ])
        ) {

            return "You're on the AceUtils website. You can check out the main site, the data system, Wazy AI, and other AceUtils projects from the navigation.";

        }

        /* DATA */

        if (
            containsAny(text, [
                "data page",
                "/data",
                "data system",
                "checker data"
            ])
        ) {

            return "The AceUtils /data page is intended for Gorilla Tag mod-checking data. The detection information can be edited directly in the site's code.";

        }

        /* WAZY */

        if (
            containsAny(text, [
                "hardcoded",
                "hard coded",
                "how do you work",
                "how do you respond"
            ])
        ) {

            return "I'm hard-coded! Instead of calling an AI API, this page checks what you type and selects a programmed response based on keywords and topics.";

        }

        /* HELP */

        if (
            containsAny(text, [
                "help",
                "what can you do",
                "commands",
                "questions"
            ])
        ) {

            return "You can ask me about AceUtils, AceUtilsPad, the mod checker, Gorilla Tag mods, coding, C#, Python, Unity, websites, Discord, or Wazy itself.";

        }

        /* AGE */

        if (
            containsAny(text, [
                "how old is ace",
                "ace age",
                "age of ace"
            ])
        ) {

            return "I don't have a programmed answer for Ace's age.";

        }

        /* FAVORITE */

        if (
            containsAny(text, [
                "favorite game",
                "fav game",
                "favorite games"
            ])
        ) {

            return "Gorilla Tag is one of the main games connected to AceUtils and Ace's development work.";

        }

        /* THANKS */

        if (
            containsAny(text, [
                "thanks",
                "thank you",
                "thx",
                "ty"
            ])
        ) {

            return randomResponse([
                "No problem!",
                "Anytime!",
                "You're welcome!",
                "Of course!"
            ]);

        }

        /* BYE */

        if (
            containsAny(text, [
                "bye",
                "goodbye",
                "see ya",
                "cya"
            ])
        ) {

            return randomResponse([
                "See ya!",
                "Later!",
                "Catch you later!",
                "Bye!"
            ]);

        }

        /* CODING QUESTION */

        if (
            containsAny(text, [
                "code",
                "coding",
                "script",
                "program"
            ])
        ) {

            return "I can give information about AceUtils' development projects and programming topics, but remember that my responses are hard-coded rather than generated by a real AI model.";

        }

        /* DEFAULT */

        return randomResponse([

            "I'm not sure how to answer that yet. Try asking me about AceUtils, AceUtilsPad, Gorilla Tag, coding, Unity, or the mod checker.",

            "I don't have a hard-coded response for that yet. Try asking about AceUtils or one of its projects.",

            "I haven't been programmed to answer that question yet. Try a question about AceUtils, Wazy, Gorilla Tag, or software development.",

            "That's outside my current response library. Ask me something about AceUtils, coding, Gorilla Tag, or AceUtilsPad."

        ]);

    }

    /* =========================================================
       KEYWORD HELPER
    ========================================================= */

    function containsAny(text, words) {

        return words.some(word => text.includes(word));

    }

    /* =========================================================
       RANDOM RESPONSE
    ========================================================= */

    function randomResponse(responses) {

        return responses[
            Math.floor(Math.random() * responses.length)
        ];

    }

    /* =========================================================
       CHAT SCROLL
    ========================================================= */

    function scrollToBottom() {

        setTimeout(() => {

            chat.scrollTo({
                top: chat.scrollHeight,
                behavior: "smooth"
            });

        }, 30);

    }

    /* =========================================================
       HISTORY
    ========================================================= */

    function updateHistory(text) {

        const historyItem = document.querySelector(
            ".history-item.active"
        );

        if (historyItem) {

            historyItem.textContent =
                text.length > 30
                    ? text.substring(0, 30) + "..."
                    : text;

        }

    }

    /* =========================================================
       NEW CHAT
    ========================================================= */

    function newChat() {

        chat.innerHTML = "";

        chat.appendChild(createWelcome());

        messageCount = 0;

        history.innerHTML = `
            <div class="history-item active">
                New conversation
            </div>
        `;

        input.value = "";

        input.style.height = "auto";

        sendButton.disabled = true;

    }

    function createWelcome() {

        const wrapper = document.createElement("div");

        wrapper.className = "welcome";

        wrapper.id = "welcome";

        wrapper.innerHTML = `

            <div class="welcome-inner">

                <div class="wazy-logo">
                    W
                </div>

                <h1>
                    What can I help with?
                </h1>

                <p>
                    I'm Wazy, the AceUtils assistant.
                    Ask me about AceUtils, coding, Gorilla Tag,
                    mods, or software development.
                </p>

                <div class="suggestions">

                    <button class="suggestion"
                        onclick="useSuggestion('What is AceUtils?')">

                        <div class="suggestion-title">
                            What is AceUtils?
                        </div>

                        <div class="suggestion-text">
                            Learn about the AceUtils project.
                        </div>

                    </button>

                    <button class="suggestion"
                        onclick="useSuggestion('What is AceUtilsPad?')">

                        <div class="suggestion-title">
                            What is AceUtilsPad?
                        </div>

                        <div class="suggestion-text">
                            Learn about the Gorilla Tag utility tablet.
                        </div>

                    </button>

                    <button class="suggestion"
                        onclick="useSuggestion('What programming languages does Ace use?')">

                        <div class="suggestion-title">
                            What does Ace code in?
                        </div>

                        <div class="suggestion-text">
                            Learn about Ace's development work.
                        </div>

                    </button>

                    <button class="suggestion"
                        onclick="useSuggestion('Tell me about Gorilla Tag mods')">

                        <div class="suggestion-title">
                            Gorilla Tag mods
                        </div>

                        <div class="suggestion-text">
                            Ask about Gorilla Tag mod development.
                        </div>

                    </button>

                </div>

            </div>
        `;

        return wrapper;

    }

    /* =========================================================
       ABOUT
    ========================================================= */

    function showAbout() {

        if (messageCount === 0) {
            welcome.style.display = "none";
        }

        addMessage(
            "wazy",
            "Wazy AI is a hard-coded assistant created for AceUtils. It doesn't use OpenAI, an API key, or an external AI model. Its answers are written directly into the website's JavaScript."
        );

    }

    /* =========================================================
       MOBILE MENU
    ========================================================= */

    function openMobileMenu() {

        document
            .getElementById("mobileSidebar")
            .classList.add("open");

    }

    function closeMobileMenu() {

        document
            .getElementById("mobileSidebar")
            .classList.remove("open");

    }

</script>

</body>
</html>
